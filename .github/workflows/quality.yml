name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out CLI
        uses: actions/checkout@v7
        with:
          path: learning-platform-cli

      - name: Check out reviewed Core
        uses: actions/checkout@v7
        with:
          repository: Acerosa/learning-platform-core
          ref: v0.2.2
          path: learning-platform-core

      - name: Check out reviewed UI
        uses: actions/checkout@v7
        with:
          repository: Acerosa/Acerosa-learning-platform-ui
          ref: v0.1.0
          path: learning-platform-ui

      - name: Check out reviewed Content
        uses: actions/checkout@v7
        with:
          repository: Acerosa/learning-platform-content
          ref: v0.1.2
          path: learning-platform-content

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: learning-platform-cli/package-lock.json

      - name: Install and test
        working-directory: learning-platform-cli
        run: |
          npm ci
          npm test
